<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>여행 블로그 글</title>
<style>
  header img { width: 120px; }
  article { width: 1000px; margin: 0 auto; }
  article img { display: block; margin: 12px 0; }
</style>
</head>
<body>
<header><img src="img/logo.png" alt="logo"></header>
<article>
  <p>첫째 날 사진입니다.</p>
  <img src="img/body_01.jpg" style="width: 800px">
  <p>둘째 날. 세로 사진이라 좁게 넣었습니다.</p>
  <img src="img/body_02.jpg" style="width: 600px">
  <p>클릭하면 원본이 열리는 썸네일입니다.</p>
  <a href="img/body_03.png"><img src="img/thumb_a.jpg" style="width: 200px"></a>
  <p>파노라마.</p>
  <img src="img/body_04.jpg" style="width: 1000px">
  <p>관련 글 썸네일(본문 아님).</p>
  <div><img src="img/thumb_b.jpg" style="width: 200px"><img src="img/thumb_c.jpg" style="width: 200px"></div>
</article>
</body>
</html>

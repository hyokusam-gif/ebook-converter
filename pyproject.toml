[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "webtoon2pdf"
version = "0.1.0"
description = "웹툰·만화 뷰어 페이지의 이미지를 수집해 PDF 전자책으로 만드는 CLI"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.45",
    "Pillow>=10",
    "img2pdf>=0.5",
    "pypdf>=4",
    "typer>=0.12",
    "rich>=13",
    "winocr>=0.0.13; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
webtoon2pdf = "webtoon2pdf.cli:app"

[project.gui-scripts]
webtoon2pdf-gui = "webtoon2pdf.gui:main"

[tool.setuptools.packages.find]
include = ["webtoon2pdf*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
